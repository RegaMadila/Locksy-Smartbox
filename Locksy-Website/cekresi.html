    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f4f8; /* Warna latar belakang yang lembut */
      }
      /* Custom scrollbar for results */
      #results-container::-webkit-scrollbar {
        width: 8px;
      }
      #results-container::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
      }
      #results-container::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }
      #results-container::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* Timeline specific styles */
      .timeline-item {
        position: relative;
        padding-left: 2.5rem; /* Space for the line and dot */
        margin-bottom: 1.5rem;
      }

      .timeline-item:last-child {
        margin-bottom: 0;
      }

      .timeline-item::after {
        content: "";
        position: absolute;
        /* Posisi ikon agar sejajar dengan garis vertikal. */
        left: -30px; /* Memposisikan ikon di luar area padding, sejajar dengan garis vertikal */
        top: 50%; /* Posisikan di tengah secara vertikal */
        transform: translateY(
          -50%
        ); /* Sesuaikan untuk penempatan tengah yang tepat */
        width: 25px;
        height: 25px;
        background-color: #4f46e5; /* Indigo dot */
        border-radius: 50%;
        border: 3px solid #e0e7ff; /* Light indigo border */
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem; /* Ukuran font ikon disesuaikan agar pas di tengah lingkaran */
        font-weight: bold;
      }

      /* Icons for timeline items */
      .timeline-item.delivered::after {
        content: "\f00c";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #10b981;
      } /* Checkmark */
      .timeline-item.in-transit::after {
        content: "\f0d1";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #f59e0b;
      } /* Truck */
      .timeline-item.received::after {
        content: "\f466";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #3b82f6;
      } /* Box */
      .timeline-item.processed::after {
        content: "\f013";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #6366f1;
      } /* Cog */
      .timeline-item.shipped::after {
        content: "\f48b";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #ef4444;
      } /* Paper plane */
      .timeline-item.default::after {
        content: "\f111";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        background-color: #6b7280;
      } /* Circle */

      /* Custom CSS Variables for Smartbox Theme (Copied from Dashboard) */
      :root {
        --sb-primary: #4b3aff; /* Primary blue */
        --sb-primary-light-bg: #e9f0ff; /* Light blue for active/icon backgrounds */
        --sb-text-dark: #1e2a4a; /* Main dark text */
        --sb-text-muted: #a3a9c1; /* Muted gray text */
        --sb-bg: #f0f6ff; /* Body background */
        --sb-card: #ffffff; /* Card background */
        --sb-border: #f0f6ff; /* Border color */
      }

      /* Custom styles for sidebar navigation items (Copied from Dashboard) */
      .sidebar-nav-item {
        display: flex;
        align-items: center; /* Ensures vertical alignment of children */
        padding: 10px 16px; /* py-2.5 px-4 */
        border-radius: 12px; /* rounded-xl */
        transition: background-color 0.2s, color 0.2s;
        color: var(--sb-text-muted); /* Default text color */
        font-size: 1rem; /* text-base for the whole item */
        font-weight: 400; /* font-normal */
        position: relative; /* For active state border */
        overflow: hidden; /* To contain border animation if any */
      }
      .sidebar-nav-item.active {
        background-color: var(
          --sb-primary-light-bg
        ); /* Light blue background for active item */
        color: var(--sb-text-dark); /* Darker text for active item */
        font-weight: 600; /* Semibold for active item */
      }
      .sidebar-nav-item.active .sidebar-icon-wrapper {
        background-color: var(
          --sb-primary
        ); /* Primary blue background for active icon wrapper */
        color: white; /* White icon for active icon wrapper */
      }
      .sidebar-nav-item:not(.active):hover {
        background-color: var(
          --sb-primary-light-bg
        ); /* Light blue on hover for inactive items */
        color: var(--sb-text-dark); /* Darker text on hover */
      }
      .sidebar-nav-item:not(.active):hover .sidebar-icon-wrapper {
        background-color: var(
          --sb-primary
        ); /* Primary blue on hover for inactive icon wrapper */
        color: white; /* White icon on hover */
      }
      /* Icon wrapper styles */
      .sidebar-icon-wrapper {
        width: 32px; /* w-8 */
        height: 32px; /* h-8 */
        border-radius: 8px; /* rounded-lg */
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-right: 12px; /* mr-3 */
        background-color: transparent; /* Default transparent background */
        color: var(--sb-text-muted); /* Default icon color */
        transition: background-color 0.2s, color 0.2s;
      }
      /* Specific icon size */
      .sidebar-icon {
        font-size: 1.125rem; /* text-lg */
      }
      /* Active state left border */
      .sidebar-nav-item.active::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background-color: var(--sb-primary); /* Primary blue border */
      }

      /* Sidebar specific styles */
      .sidebar-logo-text-md {
        color: var(--sb-text-dark);
      }
      .sidebar-logo-text-sm {
        color: var(--sb-text-dark);
      }
      .sidebar-user-card {
        background-color: var(
          --sb-primary-light-bg
        ); /* Light blue background */
      }
      .sidebar-user-avatar-bg {
        background-color: var(
          --sb-primary-light-bg
        ); /* Light blue background */
      }
      .sidebar-user-avatar-text {
        color: var(--sb-primary); /* Primary blue text */
      }
      .sidebar-user-name {
        color: var(--sb-text-dark);
      }
      .sidebar-user-email {
        color: var(--sb-text-muted);
      }
      .sidebar-logout-button {
        background-color: var(
          --sb-primary-light-bg
        ); /* Light blue background */
        color: var(--sb-text-muted); /* Muted text color */
      }
      .sidebar-logout-button:hover {
        background-color: var(--sb-primary); /* Primary blue on hover */
        color: white; /* White text on hover */
      }
      .sidebar-logout-button .fas {
        color: var(--sb-text-muted); /* Muted icon color */
      }
      .sidebar-logout-button:hover .fas {
        color: white; /* White icon on hover */
      }
      .sidebar-heading {
        color: var(--sb-text-muted);
      }

      .header-avatar-bg {

      }
      .header-avatar-text {
        color: white; /* White text for initials */
        font-size: 0.875rem; /* text-sm */
      }
    </style>

    <script>
      const API_KEY =
        "be9ab02dd7b7ec99aea7a23261dbf005567f918902a54c812cf7fd9e184e7227";
      const BASE_URL = "https://api.binderbyte.com/v1/track"; // Base URL for tracking

      const courierSelect = document.getElementById("courier-select");
      const awbInput = document.getElementById("awb-input");
      const trackButton = document.getElementById("track-button");
      const resultsContainer = document.getElementById("results-container");
      const resultsPlaceholder = document.getElementById("results-placeholder");
      const loadingIndicator = document.getElementById("loading-indicator");

      // Custom Modal Elements
      const customModal = document.getElementById("custom-modal");
      const modalTitle = document.getElementById("modal-title");
      const modalMessage = document.getElementById("modal-message");
      const modalCloseButton = document.getElementById("modal-close-button");

      // Function to show custom modal
      function showModal(title, message) {
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        customModal.classList.remove("hidden");
      }

      // Function to hide custom modal
      function hideModal() {
        customModal.classList.add("hidden");
      }

      // Event listener for modal close button
      modalCloseButton.addEventListener("click", hideModal);

      // Fetch couriers and populate dropdown
      async function fetchCouriers() {
        try {
          // Updated API endpoint for fetching courier list
          const response = await fetch(
            `https://api.binderbyte.com/v1/list_courier?api_key=${API_KEY}`
          );
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.json();
          console.log("API Response for Couriers:", data); // Log the full response

          // Check if 'data' is an array
          if (data && Array.isArray(data)) {
            courierSelect.innerHTML = '<option value="">Pilih Kurir</option>'; // Reset options
            // Iterate directly over 'data'
            data.forEach((courier) => {
              const option = document.createElement("option");
              option.value = courier.code;
              option.textContent = courier.description;
              courierSelect.appendChild(option);
            });
          } else {
            showModal(
              "Ups, Ada Error!",
              "Format data kurir dari API kok aneh ya? Coba cek konsol deh."
            );
            console.error("Invalid courier data format:", data);
          }
        } catch (error) {
          console.error("Error fetching couriers:", error);
          showModal(
            "Gagal Memuat!",
            `Daftar kurir nggak bisa dimuat nih: ${error.message}. Pastikan API Key-mu bener dan internetmu lancar ya!`
          );
          courierSelect.innerHTML =
            '<option value="">Gagal memuat kurir</option>';
        }
      }

      // Fetch tracking data
      async function fetchTrackingData() {
        const courierCode = courierSelect.value;
        const awbNumber = awbInput.value.trim();

        if (!courierCode) {
          showModal("Perhatian!", "Pilih dulu kurirnya ya, biar bisa dilacak!");
          return;
        }
        if (!awbNumber) {
          showModal("Perhatian!", "Jangan lupa masukkan nomor resinya ya!");
          return;
        }

        // Show loading indicator
        loadingIndicator.classList.remove("hidden");
        resultsPlaceholder.classList.add("hidden");
        resultsContainer.innerHTML = ""; // Clear previous results

        try {
          const url = `${BASE_URL}?api_key=${API_KEY}&courier=${courierCode}&awb=${awbNumber}`;
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.json();
          console.log("API Response for Tracking:", data); // Log the full response

          displayTrackingResults(data);
        } catch (error) {
          console.error("Error fetching tracking data:", error);
          showModal(
            "Gagal Lacak!",
            `Gagal melacak paketmu. Coba cek lagi nomor resi dan kurirnya ya!`
          );
          resultsContainer.innerHTML = `<p class="text-red-600 text-center">Gagal memuat data pelacakan.</p>`;
        } finally {
          // Hide loading indicator
          loadingIndicator.classList.add("hidden");
        }
      }

      // Function to determine CSS class for timeline icon based on description
      function getHistoryItemClass(description) {
        const lowerDesc = description.toLowerCase();
        if (
          lowerDesc.includes("delivered") ||
          lowerDesc.includes("delivery sukses")
        ) {
          return "delivered";
        } else if (
          lowerDesc.includes("with delivery courier") ||
          lowerDesc.includes("diantar") ||
          lowerDesc.includes("menuju") ||
          lowerDesc.includes("forwarded") ||
          lowerDesc.includes("departed") ||
          lowerDesc.includes("out for delivery")
        ) {
          return "in-transit";
        } else if (
          lowerDesc.includes("received at") ||
          lowerDesc.includes("tiba") ||
          lowerDesc.includes("inbound station") ||
          lowerDesc.includes("warehouse") ||
          lowerDesc.includes("origin gateway")
        ) {
          return "received";
        } else if (
          lowerDesc.includes("processed") ||
          lowerDesc.includes("diproses") ||
          lowerDesc.includes("sorting center")
        ) {
          return "processed";
        } else if (lowerDesc.includes("shipment received by")) {
          return "shipped";
        }
        return "default"; // Default icon for unknown statuses
      }

      // Display tracking results
      function displayTrackingResults(data) {
        resultsContainer.innerHTML = ""; // Clear previous results
        console.log("Entering displayTrackingResults. Data received:", data);

        // Check if data exists and status is 200
        if (data && data.status == 200) {
          console.log("API call successful (status 200).");
          // Now check if data.data exists and is an object
          if (data.data && typeof data.data === "object") {
            const summary = data.data.summary;
            const detail = data.data.detail; // Get the detail object
            const history = data.data.history;

            console.log("Summary:", summary);
            console.log("Detail:", detail);
            console.log("History:", history);

            // Ensure summary and detail exist and are objects
            if (
              summary &&
              typeof summary === "object" &&
              detail &&
              typeof detail === "object"
            ) {
              console.log("Summary and Detail objects are valid.");
              let html = `
                            <div class="mb-4 p-4 bg-blue-100 rounded-lg shadow-md">
                                <h2 class="text-xl font-semibold text-blue-800 mb-2">Ringkasan Pelacakan Paketmu</h2>
                                <p class="text-gray-700"><span class="font-medium">Kurir:</span> ${
                                  summary.courier || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Nomor Resi:</span> ${
                                  summary.awb || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Status:</span> <span class="font-bold text-green-700">${
                                  summary.status || "N/A"
                                }</span></p>
                                <p class="text-gray-700"><span class="font-medium">Layanan:</span> ${
                                  summary.service || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Tanggal Pengiriman:</span> ${
                                  summary.date || "N/A"
                                }</p>

                                <!-- Mengambil dari detail -->
                                <p class="text-gray-700"><span class="font-medium">Pengirim:</span> ${
                                  detail.shipper || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Penerima:</span> ${
                                  detail.receiver || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Asal:</span> ${
                                  detail.origin || "N/A"
                                }</p>
                                <p class="text-gray-700"><span class="font-medium">Tujuan:</span> ${
                                  detail.destination || "N/A"
                                }</p>
                            </div>
                        `;

              if (history && Array.isArray(history) && history.length > 0) {
                console.log("History is valid and not empty.");
                html += `
                                <div class="p-4 bg-green-50 rounded-lg shadow-md">
                                    <h2 class="text-xl font-semibold text-green-800 mb-4">Perjalanan Paketmu</h2>
                                    <div class="relative pl-8"> <!-- Container for timeline -->
                                        <div class="absolute left-[13px] top-0 bottom-0 w-0.5 bg-gray-300"></div> <!-- Vertical line -->
                                        <ul class="space-y-4">
                            `;
                history.forEach((item) => {
                  const dateTime =
                    item.date && item.time
                      ? `${item.date} ${item.time}`
                      : item.date || item.time || "N/A";
                  const itemClass = getHistoryItemClass(item.desc || ""); // Get class for icon
                  html += `
                                    <li class="timeline-item ${itemClass} bg-white p-3 rounded-md shadow-sm border border-gray-100 transition-all duration-200 hover:shadow-lg">
                                        <p class="text-sm font-semibold text-indigo-700 mb-1">${dateTime}</p>
                                        <p class="text-gray-700">${
                                          item.desc || "N/A"
                                        }</p>
                                    </li>
                                `;
                });
                html += `
                                        </ul>
                                    </div>
                                </div>
                            `;
              } else {
                console.log("History is empty or invalid.");
                html += `<p class="text-gray-600 text-center mt-4">Duh, belum ada riwayat perjalanan untuk resi ini.</p>`;
              }
              resultsContainer.innerHTML = html;
            } else {
              // If status is 200 but summary or detail is missing or not an object
              resultsContainer.innerHTML = `<p class="text-gray-600 text-center">Data ringkasan atau detail pelacakan nggak ketemu atau formatnya salah, padahal API-nya sukses. Coba cek konsol deh.</p>`;
              console.warn(
                "API returned status 200 but missing summary/detail data or invalid:",
                data
              );
            }
          } else {
            // If status is 200 but data.data is missing or not an object
            resultsContainer.innerHTML = `<p class="text-gray-600 text-center">Data pelacakan nggak ketemu atau formatnya salah, padahal API-nya sukses. Coba cek konsol deh.</p>`;
            console.warn(
              "API returned status 200 but data.data object is missing or invalid:",
              data
            );
          }
        } else {
          // Handle API errors or non-200 status
          const errorMessage =
            data && data.status && data.status.description
              ? data.status.description
              : "Ada masalah saat melacak atau nomor resinya nggak ketemu. Pastikan nomor resi dan kurirnya sudah benar ya!";
          resultsContainer.innerHTML = `<p class="text-red-600 text-center">${errorMessage}</p>`;
          console.error(
            "API Tracking Error or Non-200 Status or Invalid Data Structure:",
            data
          );
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const resi = urlParams.get("resi");

        if (resi) {
          document.getElementById("awb-input").value = resi;
        }
      });

      // Initial fetch of couriers when the page loads
      document.addEventListener("DOMContentLoaded", fetchCouriers);

      // Event listener for the track button
      trackButton.addEventListener("click", fetchTrackingData);

      // Allow pressing Enter in AWB input to trigger tracking
      awbInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          event.preventDefault(); // Prevent default form submission if any
          fetchTrackingData();
        }
      });

      // --- Start: Copied from Dashboard for Sidebar and Header ---
      // Function to toggle dropdown menu
      function toggleDropdown() {
        const dropdown = document.getElementById("avatarDropdown");

        if (dropdown.classList.contains("hidden")) {
          // Show dropdown with animation
          dropdown.classList.remove("hidden");
          setTimeout(() => {
            dropdown.classList.remove("opacity-0", "scale-95");
            dropdown.classList.add("opacity-100", "scale-100");
          }, 10);
        } else {
          // Hide dropdown with animation
          dropdown.classList.remove("opacity-100", "scale-100");
          dropdown.classList.add("opacity-0", "scale-95");
          setTimeout(() => {
            dropdown.classList.add("hidden");
          }, 200);
        }
      }

      // Function to sign out
      function signOut() {
        localStorage.removeItem("jwt");
        localStorage.removeItem("user");
        localStorage.removeItem("userId");
        window.location.href = "sign-in.html";
      }

      // Add this to your existing script or create a new one
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user && user.username) {
          document.getElementById("username").textContent = user.username;
          document.getElementById("sidebarUsername").textContent =
            user.username;
          document.getElementById("sidebarUserEmail").textContent = user.email; // Assuming user.email exists
          document.getElementById("avatarInitials").textContent = user.username
            .substring(0, 2)
            .toUpperCase();
          document.getElementById("headerAvatarInitials").textContent =
            user.username.substring(0, 2).toUpperCase();
        } else {
          // Redirect to login if no user data found
          window.location.href = "sign-in.html";
        }

        // Initialize sidebar and main content state
        setSidebarAndMainContentState();
      });

      // Function to set sidebar and main content state based on screen width
      function setSidebarAndMainContentState() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.querySelector("main");
        const sidebarOverlay = document.getElementById("sidebarOverlay");

        if (window.innerWidth >= 768) {
          // md breakpoint
          sidebar.classList.remove("-translate-x-full"); // Ensure sidebar is visible on desktop
          mainContent.classList.remove("ml-0");
          mainContent.classList.add("ml-64"); // Push main content for desktop
          sidebarOverlay.classList.add("hidden"); // Hide overlay on desktop
        } else {
          sidebar.classList.add("-translate-x-full"); // Ensure sidebar is hidden on mobile
          mainContent.classList.remove("ml-64");
          mainContent.classList.add("ml-0"); // Reset main content margin for mobile
          sidebarOverlay.classList.add("hidden"); // Hide overlay on mobile
        }
      }

      // Sidebar toggle functionality
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.querySelector("main");
        const sidebarOverlay = document.getElementById("sidebarOverlay");

        if (sidebar.classList.contains("-translate-x-full")) {
          // Show sidebar
          sidebar.classList.remove("-translate-x-full");
          mainContent.classList.remove("ml-0");
          mainContent.classList.add("ml-64"); // Push main content
          sidebarOverlay.classList.remove("hidden"); // Show overlay
        } else {
          // Hide sidebar
          sidebar.classList.add("-translate-x-full");
          mainContent.classList.remove("ml-64");
          mainContent.classList.add("ml-0"); // Reset main content margin
          sidebarOverlay.classList.add("hidden"); // Hide overlay
        }
      }

      // Adjust main content margin on window resize to handle responsiveness
      window.addEventListener("resize", setSidebarAndMainContentState);
