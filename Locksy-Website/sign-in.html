<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <div
      id="alert"
      class="hidden fixed top-4 right-4 p-4 rounded-lg text-white"
    ></div>
    <!-- Main container: Use flex-col on small screens, flex-row on md and up -->
    <div class="flex flex-1 min-h-0 flex-col md:flex-row">
      <!-- Left side (Form) -->
      <!-- On small screens (default), take full width (w-full).
           On md screens and up, take half width (md:w-1/2).
           Adjust padding to avoid being too cramped on mobile.
      -->
      <div
        class="flex flex-col items-center justify-between w-full md:w-1/2 p-4 sm:p-8 md:p-12"
      >
        <div class="max-w-[360px] w-full mt-12 mb-auto">
          <!-- Added mb-auto so the form doesn't push down if content is small -->
          <h2
            class="text-[#1E2A5B] font-semibold text-2xl mb-2 text-center md:text-left"
          >
            Sign In
          </h2>
          <p class="text-xs text-[#8F9BB3] mb-6 text-center md:text-left">
            Enter your email and password to sign in!
          </p>
          <form
            id="loginForm"
            autocomplete="off"
            class="space-y-6 mt-8"
            novalidate=""
          >
            <div>
              <label
                class="block text-sm font-semibold text-[#1E2A5B] mb-2"
                for="email"
              >
                Email
                <span class="text-red-600"> * </span>
              </label>
              <input
                class="w-full text-sm text-[#1E2A5B] placeholder:text-[#D1D5DB] border border-[#E6E8F0] rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-[#3B33FF]"
                id="email"
                name="email"
                placeholder="Enter your email"
                required=""
                type="email"
              />
            </div>
            <div>
              <label
                class="block text-sm font-semibold text-[#1E2A5B] mb-2"
                for="password"
              >
                Password
                <span class="text-red-600"> * </span>
              </label>
              <div class="relative">
                <input
                  class="w-full text-sm text-[#1E2A5B] placeholder:text-[#D1D5DB] border border-[#E6E8F0] rounded-md py-3 px-4 pr-10 focus:outline-none focus:ring-2 focus:ring-[#3B33FF]"
                  id="password"
                  minlength="8"
                  name="password"
                  placeholder="Enter your password"
                  required=""
                  type="password"
                />
                <button
                  aria-label="Toggle password visibility"
                  class="absolute inset-y-0 right-3 flex items-center text-[#8F9BB3] text-xs"
                  type="button"
                >
                  <i id="passwordIcon" class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="w-full bg-[#3B33FF] text-white text-[10px] font-semibold py-2 rounded-md hover:bg-[#2a24cc] transition-colors"
            >
              Sign In
            </button>
            <p class="text-[12px] text-[#8F9BB3]">
              <!-- Center "Not registered yet?" text on mobile -->
              Not registered yet?
              <a
                class="font-semibold text-[#3B33FF] hover:underline"
                href="register.html"
              >
                Create an Account
              </a>
            </p>
          </form>
        </div>
        <!-- Removed extra spacing div for mobile as image is now below -->
      </div>

      <!-- Right side (Image) -->
      <!-- On mobile, image will be visible (flex) and take full width (w-full).
           It will have rounded top-left and top-right corners.
           On md screens and up, image will take half width (md:w-1/2) and revert to rounded bottom-left.
           Added mt-8 for spacing on mobile, and md:mt-0 to remove it on desktop.
      -->
      <div
        class="flex w-full md:w-1/2 relative overflow-hidden rounded-tl-[50px] rounded-tr-[50px] md:rounded-tl-none md:rounded-tr-none md:rounded-bl-[100px] mt-8 md:mt-0"
      >
        <img
          alt="Blue and purple abstract gradient background with smooth curves"
          class="object-cover w-full h-full"
          height="800"
          src="img/bg.png"
          width="800"
        />
      </div>
    </div>
    <!-- Toast Container -->
    <div
      id="toast"
      class="fixed top-4 right-4 z-50 transform transition-transform duration-300 ease-in-out translate-x-full"
    >
      <div class="flex items-center p-4 mb-4 rounded-lg shadow">
        <div
          class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
        >
          <i class="fas"></i>
        </div>
        <div class="ml-3 text-sm font-normal" id="toastMessage"></div>
        <button
          onclick="hideToast()"
          class="ml-4 -mx-1.5 -my-1.5 rounded-lg p-1.5 inline-flex h-8 w-8"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <script>
      function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toastMessage");
        const icon = toast.querySelector(".fas");
        const div = toast.querySelector("div");
        const button = toast.querySelector("button");

        // Set styles based on type
        if (type === "success") {
          div.className =
            "flex items-center p-4 mb-4 text-green-800 rounded-lg bg-green-50";
          icon.className = "fas fa-check-circle";
          button.className =
            "ml-4 text-green-800 hover:text-green-900 rounded-lg p-1.5 inline-flex h-8 w-8";
        } else if (type === "error") {
          div.className =
            "flex items-center p-4 mb-4 text-red-800 rounded-lg bg-red-50";
          icon.className = "fas fa-times-circle";
          button.className =
            "ml-4 text-red-800 hover:text-red-900 rounded-lg p-1.5 inline-flex h-8 w-8";
        }

        toastMessage.textContent = message;
        toast.classList.remove("translate-x-full");

        setTimeout(() => hideToast(), 3000);
      }

      function hideToast() {
        document.getElementById("toast").classList.add("translate-x-full");
      }
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch(
              "http://localhost:1337/api/auth/local",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  identifier: email,
                  password: password,
                }),
              }
            );

            const data = await response.json();

            if (data.jwt) {
              // Save token, user data, and ID
              localStorage.setItem("jwt", data.jwt);
              localStorage.setItem("user", JSON.stringify(data.user));
              localStorage.setItem("userId", data.user.id);

              // Show success toast
              showToast("Login successful!");

              // Redirect to dashboard after a short delay
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1500);
            } else {
              throw new Error(data.error.message);
            }
          } catch (error) {
            // Show error toast
            showToast(error.message || "Invalid credentials", "error");
          }
        });

      document
        .querySelector('[aria-label="Toggle password visibility"]')
        .addEventListener("click", () => {
          const passwordInput = document.getElementById("password");
          const passwordIcon = document.getElementById("passwordIcon");
          const isPasswordVisible = passwordInput.type === "text";

          // Toggle input type
          passwordInput.type = isPasswordVisible ? "password" : "text";

          // Change icon
          passwordIcon.className = isPasswordVisible
            ? "fas fa-eye"
            : "fas fa-eye-slash";
        });
    </script>
  </body>
</html>
